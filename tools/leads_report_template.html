<title>Mapa de solicitudes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a working report for the partners. One column of sections, each opens with a plain-language finding,
   then the evidence (bars and tables drawn from the data), then the decision it supports. Language colours are fixed
   for the whole page: ES vermilion, FR blue, EN green, RU mauve (Okabe-Ito based). */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --ink: #14202e; --muted: #556575; --line: #d7dee5; --line-soft: #e8edf1;
  --accent: #0b5c7a; --accent-soft: #e1eff4; --warn: #a24a07; --warn-soft: #fbeedd; --good: #1b7048; --good-soft: #e0f1e8;
  --c-es: #c9531a; --c-fr: #1f63b5; --c-en: #0f8a67; --c-ru: #9a4a8c; --bar: #8aa5b8; --bar-soft: #cbd9e3;
  --font-display: "Literata", Georgia, "Times New Roman", serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1822; --surface: #17232f; --ink: #e6edf3; --muted: #9fb0c0; --line: #2b3b4a; --line-soft: #223140;
    --accent: #6cc3e3; --accent-soft: #19313e; --warn: #f0a560; --warn-soft: #3a2a18; --good: #5fcf98; --good-soft: #17352a;
    --c-es: #ff8f55; --c-fr: #6aa9f0; --c-en: #3fcaa0; --c-ru: #d78fc9; --bar: #5f87a0; --bar-soft: #2a4153; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1822; --surface: #17232f; --ink: #e6edf3; --muted: #9fb0c0; --line: #2b3b4a; --line-soft: #223140;
  --accent: #6cc3e3; --accent-soft: #19313e; --warn: #f0a560; --warn-soft: #3a2a18; --good: #5fcf98; --good-soft: #17352a;
  --c-es: #ff8f55; --c-fr: #6aa9f0; --c-en: #3fcaa0; --c-ru: #d78fc9; --bar: #5f87a0; --bar-soft: #2a4153; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; padding-inline: 16px; padding-block: 0 56px; }
.wrap { max-width: 1060px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 650; text-wrap: balance; line-height: 1.2; margin: 0; }
h1 { font-size: clamp(26px, 4.4vw, 38px); }
h2 { font-size: clamp(21px, 3vw, 26px); }
h3 { font-size: 17px; }
p { margin: 0; max-width: 72ch; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
header.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 14px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.lang button { font: inherit; font-weight: 600; font-size: 13px; padding: 6px 14px; border: 0; background: var(--surface); color: var(--muted); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
.lang button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
nav.toc { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
nav.toc a { text-decoration: none; color: var(--muted); }
nav.toc a:hover { color: var(--accent); }
.hero { padding-block: 34px 10px; display: grid; gap: 14px; }
.hero p.lead { font-size: 17px; color: var(--ink); }
.kpis { display: flex; flex-wrap: wrap; gap: 10px; margin-block: 18px 4px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 150px; flex: 1 1 150px; }
.kpi b { display: block; font-family: var(--font-display); font-size: 26px; font-weight: 650; line-height: 1.1; }
.kpi span { font-size: 12.5px; color: var(--muted); }
section { padding-block: 34px 6px; display: grid; gap: 16px; scroll-margin-top: 70px; }
section > .intro { color: var(--muted); }
.find { display: grid; gap: 10px; counter-reset: f; }
.find li { list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
.find li strong { font-weight: 600; }
.find { padding: 0; margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); }
.note { font-size: 13px; color: var(--muted); max-width: 80ch; }
.tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.good { background: var(--good-soft); color: var(--good); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--ink); background: var(--surface); }
.chip i { font-style: normal; color: var(--muted); margin-left: 4px; }
.bars { display: grid; gap: 5px; }
.bar { display: grid; grid-template-columns: minmax(90px, 40%) 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
.bar .l { min-width: 0; overflow-wrap: anywhere; }
.bar .t { height: 9px; background: var(--line-soft); border-radius: 5px; overflow: hidden; }
.bar .t i { display: block; height: 100%; background: var(--bar); border-radius: 5px; }
.bar .v { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; min-width: 48px; text-align: right; }
.bar.es .t i { background: var(--c-es); } .bar.fr .t i { background: var(--c-fr); } .bar.en .t i { background: var(--c-en); } .bar.ru .t i { background: var(--c-ru); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; background: var(--k); vertical-align: -1px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.area td { background: var(--accent-soft); font-weight: 600; }
tr.prop td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
.mini { display: flex; height: 8px; border-radius: 4px; overflow: hidden; min-width: 90px; background: var(--line-soft); }
.mini i { display: block; height: 100%; }
.flow { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); counter-reset: s; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; align-content: start; }
.step .k { font-family: var(--font-display); font-size: 13px; color: var(--accent); font-weight: 650; }
.step ul { margin: 0; padding-left: 18px; font-size: 13.5px; display: grid; gap: 3px; }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
details + details { margin-top: 8px; }
summary { cursor: pointer; font-weight: 600; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
details .body { display: grid; gap: 10px; padding-top: 10px; }
details ol, details ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; }
.sg a { display: block; font-size: 13.5px; }
.recs { counter-reset: r; display: grid; gap: 8px; padding: 0; margin: 0; }
.recs li { list-style: none; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 10px 14px; display: grid; gap: 2px; }
.files code { font-size: 12.5px; background: var(--line-soft); padding: 1px 6px; border-radius: 4px; }
.spark { display: inline-flex; gap: 2px; align-items: flex-end; height: 22px; }
.spark i { width: 10px; background: var(--bar); border-radius: 2px 2px 0 0; display: block; }
svg text { fill: var(--muted); font-family: var(--font-body); font-size: 11px; }
svg .ax { stroke: var(--line); stroke-width: 1; }
svg .es { fill: var(--c-es); } svg .fr { fill: var(--c-fr); } svg .en { fill: var(--c-en); } svg .ru { fill: var(--c-ru); }
@media (max-width: 560px) { .bar { grid-template-columns: minmax(80px, 46%) 1fr auto; } }
@media (prefers-reduced-motion: no-preference) { .bar .t i { transition: width .4s ease; } }
</style>

<div class="wrap">
  <header class="top">
    <nav class="toc" id="toc" aria-label="sections"></nav>
    <div class="lang" role="group" aria-label="Idioma / Langue">
      <button type="button" id="b-es" aria-pressed="true">ES</button>
      <button type="button" id="b-fr" aria-pressed="false">FR</button>
    </div>
  </header>
  <main id="app"></main>
</div>

<script>
const D = __DATA__;
const LANGS = ["es", "en", "fr", "ru"];
const LNAME = { es: { es: "Formulario ES", fr: "Formulaire ES" }, en: { es: "Formulario EN", fr: "Formulaire EN" }, fr: { es: "Formulario FR", fr: "Formulaire FR" }, ru: { es: "Formulario RU", fr: "Formulaire RU" } };
let lang = "es";
const nf = () => new Intl.NumberFormat(lang === "fr" ? "fr-FR" : "es-ES");
const fmt = n => nf().format(n);
const pc = (a, b) => b ? Math.round(100 * a / b) : 0;
const pct = (a, b) => pc(a, b) + (lang === "fr" ? " %" : " %");
const sum = a => a.reduce((x, y) => x + y, 0);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tagL = c => (D.tags[c] ? D.tags[c][lang] : c);
const leafL = c => (D.leaves[c] ? D.leaves[c][lang] : c);
const areaL = c => (D.areas[c] ? D.areas[c][lang] : c);
const ctry = k => (D.country_names[k] ? D.country_names[k][lang] : (k === "US/CA" ? (lang === "fr" ? "États-Unis / Canada (+1)" : "EE. UU. / Canadá (+1)") : k === "RU/KZ" ? (lang === "fr" ? "Russie / Kazakhstan (+7)" : "Rusia / Kazajistán (+7)") : k));
const dateL = s => new Date(s + "T12:00:00").toLocaleDateString(lang === "fr" ? "fr-FR" : "es-ES", { day: "numeric", month: "long", year: "numeric" });
const TEXT_N = l => D.meta.text_by_lang[l] || 0;
const TXT_ALL = sum(["es", "en", "fr"].map(TEXT_N));

function bars(items, cls, max) {
  const m = max || Math.max(1, ...items.map(i => i[1]));
  return '<div class="bars">' + items.map(i => `<div class="bar ${cls || ""}"><span class="l">${esc(i[0])}</span><span class="t"><i style="width:${Math.max(2, 100 * i[1] / m)}%"></i></span><span class="v">${i[2] !== undefined ? i[2] : fmt(i[1])}</span></div>`).join("") + "</div>";
}
function stackBar(parts) { // parts: [[value, cssVar]]
  const t = sum(parts.map(p => p[0])) || 1;
  return '<div class="mini">' + parts.map(p => `<i style="width:${100 * p[0] / t}%;background:var(${p[1]})"></i>`).join("") + "</div>";
}

/* ---------------- derived numbers ---------------- */
const K = {};
(function () {
  const m = D.multi;
  K.multi = sum(["es", "en", "fr"].map(l => m[l].n));
  K.multiPct = pc(K.multi, TXT_ALL);
  K.other = D.other_reclassified.total;
  K.otherLegal = pc(K.other - (D.other_reclassified.by_area.OTR || 0), K.other);
  const entries = Object.entries(D.tag_overall).filter(([c]) => !c.startsWith("x_") && !["ext_general", "fis_general", "inm_general"].includes(c)).sort((a, b) => b[1] - a[1]);
  K.rank = {};
  entries.forEach(([c], i) => K.rank[c] = i + 1);
  K.herencia = D.tag_overall.suc_herencia; K.herenciaPct = pc(K.herencia, D.meta.coverage.text_analysed);
  K.familia = D.tag_overall.suc_familia;
  K.ext = D.leaf_stats["EXT-4"].n; K.extPct = pc(K.ext, D.meta.coverage.text_analysed);
  K.frAbroad = pc(D.country_split.fr.other, D.country_split.fr.with_country);
  K.esSpain = pc(D.country_split.es.spain, D.country_split.es.with_country);
  K.enSpain = pc(D.country_split.en.spain, D.country_split.en.with_country);
  K.blog = pc(D.journey.with_blog, D.journey.n); K.frBlog = pc(D.journey.by_lang.fr.blog, D.journey.by_lang.fr.n);
  K.bc = l => pc(D.blog_candidate[l].n, D.blog_candidate[l].of);
  K.fl = (l, k) => pc(D.flags[l][k], TEXT_N(l));
  K.natPct = pc(sum(["es", "en", "fr"].map(l => D.nat_n[l])), TXT_ALL);
  K.chat = sum(LANGS.map(l => D.traffic[l].chatgpt || 0)); K.ads = sum(LANGS.map(l => D.traffic[l].google_ads || 0));
  K.labPeople = D.leaf_stats["LAB-1"].n; K.labCo = sum(["LAB-2", "LAB-3", "LAB-4"].map(k => D.leaf_stats[k] ? D.leaf_stats[k].n : 0));
})();

/* ---------------- i18n ---------------- */
const X = {
  es: {
    title: "Qué nos piden por el formulario web",
    eyebrow: "Delaguía y Luzón · Análisis de formularios web",
    lead: () => `${fmt(D.meta.total)} solicitudes entre el ${dateL(D.meta.first)} y el ${dateL(D.meta.last)}, en 9 formularios y 4 idiomas. El informe las clasifica por especialidad, país, nacionalidad y subtema, para diseñar un formulario de 4 pasos que haga las preguntas correctas y proponga artículos del blog cuando alguien solo busca información.`,
    toc: [["esencial", "Lo esencial"], ["volumen", "Volumen"], ["tipo", "Tipo de lead"], ["origen", "Origen"], ["areas", "Áreas"], ["idiomas", "Por idioma"], ["arbol", "Árbol de especialidades"], ["combos", "Temas combinados"], ["form", "Formulario en 4 pasos"], ["blog", "Blog"], ["recom", "Recomendaciones"], ["metodo", "Método y límites"]],
    kpi: [["solicitudes recibidas"], ["con mensaje analizado"], ["tocan 2 o más subtemas"], ["solo piden información"], ["leyeron un artículo antes de escribir"]],
    h_esencial: "Lo esencial",
    find: () => [
      [`Un ${K.multiPct} % de las solicitudes mezcla temas`, `Se trata de combinaciones como NIE y creación de empresa, renta y convenio de doble imposición, o herencia y notaría. Con un desplegable de una sola categoría, la persona elige una y las demás se pierden. El formulario debe aceptar varias etiquetas y guardarlas.`],
      [`«Otro(s)» esconde demanda real`, `De ${fmt(K.other)} solicitudes marcadas «Otro(s)» en los formularios generales ES y FR, un ${K.otherLegal} % trata de un tema jurídico claro, sobre todo extranjería, creación de empresa y fiscalidad.`],
      [`Herencias y testamentos: n.º ${K.rank.suc_herencia} de los temas, sin hoja propia`, `${fmt(K.herencia)} solicitudes (${K.herenciaPct} % de las analizadas) hablan de herencia. La web solo la cubre dentro de «Sucesiones y planificación patrimonial», bajo Fiscalidad. Divorcio, custodia y adopción (${fmt(K.familia)}) tampoco tienen lugar en el árbol.`],
      [`Extranjería pesa un ${K.extPct} % y su única hoja es demasiado grande`, `«Residencia, nacionalidad, reagrupación» reúne NIE y TIE, nómada digital, no lucrativa, trabajo, estudios, arraigo, recursos y regularización. Proponemos cinco rutas de formulario y de página (ver árbol).`],
      [`Cada idioma tiene su público`, `ES: residentes con asuntos del día a día (inmuebles, notaría, herencia, despidos, Hacienda); un ${K.esSpain} % de quienes indican país vive en España. FR: un ${K.frAbroad} % vive fuera de España y prepara el salto (NIE, crear empresa, comprar, emprendedor). EN: visados de teletrabajo y residencia, y fiscalidad del recién llegado. RU: pocos, casi todos extranjería e impuestos.`],
      [`Hay margen para informar antes de vender`, `Solo piden información el ${K.bc("fr")} % de las solicitudes FR y el ${K.bc("es")} % de las ES. Un ${K.blog} % de quienes tienen recorrido registrado leyó un artículo del blog antes de escribir (${K.frBlog} % en FR). En los subtemas más pedidos hay muy pocos artículos en el idioma de quien escribe (ver Blog).`],
      [`Plazos y presupuestos aparecen en el primer mensaje`, `Citan urgencia o plazo el ${K.fl("es", "u")} % de las solicitudes ES y el ${K.fl("fr", "u")} % de las FR; piden honorarios el ${K.fl("es", "p")} % y el ${K.fl("fr", "p")} %. El paso 4 debe recoger la fecha límite.`],
    ],
    h_volumen: "Volumen y evolución por idioma",
    i_volumen: () => {
      const q = D.quarters; const g = (l, k) => q[l][k] || 0;
      return `Las solicitudes en español crecen (de ${g("es", "2025-Q1")} en el primer trimestre de 2025 a ${g("es", "2026-Q3")} en el tercero de 2026) y las inglesas casi se duplican (de ${g("en", "2025-Q1")} a ${g("en", "2026-Q3")}). Las francesas bajan desde el máximo del primer trimestre de 2025 (${g("fr", "2025-Q1")}; ${g("fr", "2026-Q3")} en el tercero de 2026). El ruso se mantiene en unas ${Math.round(sum(Object.values(q.ru)) / Object.keys(q.ru).length)} al trimestre. El último trimestre de 2026 está incompleto.`;
    },
    h_tipo: "Tipo de lead",
    i_tipo: "Particular o empresa, y qué pide en el primer mensaje. Los porcentajes del bloque de intención se calculan solo sobre los mensajes analizados (ES, FR y el formulario de inmigración EN).",
    client: "Particular · Empresa", nature: "Intención del primer mensaje", natK: { urgente: "Urgente o con plazo", presupuesto: "Pide presupuesto", cita: "Pide cita o llamada", informacion: "Pregunta o pide información", otro: "Otros", caso_detallado: "Caso detallado", ajeno: "Ajeno (comercial, empleo)", cliente_actual: "Cliente actual" },
    flagsT: "Mencionan en el texto", fP: "honorarios o presupuesto", fA: "cita o llamada", fU: "urgencia o plazo", fI: "una pregunta o petición de información",
    medLen: "Mensaje mediano", chars: "caracteres",
    h_origen: "País de origen y nacionalidad",
    i_origen: () => `Ningún formulario pregunta el país ni la nacionalidad. El país sale del prefijo telefónico (solo se conserva el código del país), del desplegable «Ubicación» de los formularios de extranjería y del país de residencia cuando el texto lo dice. La nacionalidad solo se registra si la persona la declara (por ejemplo «soy venezolano»): ocurre en el ${K.natPct} % de los mensajes analizados, así que las cifras de nacionalidad son un suelo, no el total.`,
    ctryT: "Países de los leads", natT: "Nacionalidades declaradas", inSpain: "viven en España", outSpain: "fuera de España", unknown: "sin dato", famNat: "Nacionalidad de familiares mencionados",
    cNote: "+1 y +7 son prefijos compartidos (EE. UU./Canadá, Rusia/Kazajistán).",
    traffic: () => `Canal visible en la dirección de la página: ${K.chat} solicitudes llegaron con parámetros de ChatGPT y ${K.ads} de anuncios de Google; el resto no deja rastro en la dirección.`,
    h_areas: "Las seis áreas: lo que dice el desplegable frente a lo que dice el texto",
    i_areas: () => `Reclasificar por el contenido del mensaje mueve las cifras. En los formularios generales ES y FR, «Otro(s)» agrupa ${fmt(K.other)} solicitudes; un ${K.otherLegal} % tiene tema jurídico (extranjería ${D.other_reclassified.by_area.EXT}, mercantil ${D.other_reclassified.by_area.MER}, fiscal ${D.other_reclassified.by_area.FIS}, sucesiones ${D.other_reclassified.by_area.SUC}, inmobiliario ${D.other_reclassified.by_area.INM}, laboral ${D.other_reclassified.by_area.LAB}).`,
    colDD: "Desplegable", colTX: "Texto", other: "Otros / no jurídico",
    h_idiomas: "Tendencias por idioma",
    i_idiomas: "Cada tarjeta resume a quién atiende el formulario de ese idioma, qué pide y qué sobresale frente al resto. «Sobresale» compara el peso de un subtema en ese idioma con el peso en los otros dos (ES frente a FR y al revés).",
    top: "Subtemas más frecuentes", lift: "Sobresale frente al otro idioma", rich: "Qué pide con más frecuencia",
    cards: {
      es: { h: "Español: residentes con asuntos del día a día", p: () => `Un ${pc(D.client.es.p, D.client.es.p + D.client.es.c)} % son particulares. ${K.esSpain} % de quienes dan país viven en España. El formulario ES también recoge a no hispanohablantes: ${D.msg_lang.es.en + D.msg_lang.es.fr + (D.msg_lang.es.ru || 0)} de ${TEXT_N("es")} mensajes llegan en inglés, francés o ruso. Predominan inmuebles (compra, notaría, alquiler), herencia, trabajo (despido, contrato, salario) y Hacienda.` },

/* ---------------- render ---------------- */
function quartersSVG() {
  const qs = [...new Set(LANGS.flatMap(l => Object.keys(D.quarters[l])))].sort();
  const W = 760, H = 250, L = 34, B = 30, T = 10, R = 8;
  const tot = qs.map(q => sum(LANGS.map(l => D.quarters[l][q] || 0)));
  const max = Math.ceil(Math.max(...tot) / 50) * 50;
  const bw = (W - L - R) / qs.length;
  const y = v => T + (H - T - B) * (1 - v / max);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${lang === "fr" ? "Demandes par trimestre et par langue" : "Solicitudes por trimestre e idioma"}">`;
  for (let v = 0; v <= max; v += 50) s += `<line class="ax" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  qs.forEach((q, i) => {
    let acc = 0; const x = L + i * bw + bw * 0.16, w = bw * 0.68;
    ["fr", "en", "es", "ru"].forEach(l => {
      const v = D.quarters[l][q] || 0; if (!v) return;
      s += `<rect class="${l}" x="${x}" y="${y(acc + v)}" width="${w}" height="${y(acc) - y(acc + v)}" rx="2"><title>${LNAME[l][lang]} ${q}: ${v}</title></rect>`; acc += v;
    });
    s += `<text x="${x + w / 2}" y="${y(acc) - 4}" text-anchor="middle">${acc}</text>`;
    s += `<text x="${x + w / 2}" y="${H - 10}" text-anchor="middle">T${q.slice(6)} ${q.slice(2, 4)}</text>`;
  });
  return s + "</svg>";
}
function legend() { return `<div class="legend">${["es", "fr", "en", "ru"].map(l => `<span style="--k:var(--c-${l})">${LNAME[l][lang].replace(/Formul\w+ /, "")}</span>`).join("")}</div>`; }

function sectionVolume(t) {

}
function sectionTipo(t) {
  const order = ["urgente", "presupuesto", "cita", "informacion", "caso_detallado", "otro"];

  const rowsN = ["es", "fr", "en"].map(l => {
    const n = D.nature[l]; const base = sum(order.map(k => n[k] || 0));
    return `<tr><td>${LNAME[l][lang]}</td><td class="n">${fmt(base)}</td><td style="min-width:240px">${stackBar(order.map(k => [n[k] || 0, cols[k]]))}</td><td class="n">${pct(D.client[l].p, D.client[l].p + D.client[l].c)} · ${pct(D.client[l].c, D.client[l].p + D.client[l].c)}</td><td class="n">${D.msg_len_median[l] ? fmt(D.msg_len_median[l]) : "n/d"}</td></tr>`;
  }).join("");
  const ru = (() => { const c = D.client.ru; return `<tr><td>${LNAME.ru[lang]}</td><td class="n">0</td><td class="note">n/d</td><td class="n">${pct(c.p, c.p + c.c)} · ${pct(c.c, c.p + c.c)}</td><td class="n">n/d</td></tr>`; })();
  const legendN = `<div class="legend">${order.map(k => `<span style="--k:var(${cols[k]})">${t.natK[k]}</span>`).join("")}</div>`;
  const flagRows = ["es", "fr", "en"].map(l => `<tr><td>${LNAME[l][lang]}</td><td class="n">${K.fl(l, "p")} %</td><td class="n">${K.fl(l, "a")} %</td><td class="n">${K.fl(l, "u")} %</td><td class="n">${K.fl(l, "i")} %</td></tr>`).join("");
  return `<section id="tipo"><h2>${t.h_tipo}</h2><p class="intro">${t.i_tipo}</p>
  <div class="card"><h3>${t.nature}</h3>${legendN}<div class="scroll"><table><thead><tr><th></th><th class="n">n</th><th>${t.nature}</th><th class="n">${t.client}</th><th class="n">${t.medLen} (${t.chars})</th></tr></thead><tbody>${rowsN}${ru}</tbody></table></div></div>
  <div class="card"><h3>${t.flagsT}</h3><div class="scroll"><table><thead><tr><th></th><th class="n">${t.fP}</th><th class="n">${t.fA}</th><th class="n">${t.fU}</th><th class="n">${t.fI}</th></tr></thead><tbody>${flagRows}</tbody></table></div><p class="note">${lang === "fr" ? "Une demande peut cocher plusieurs cases. EN : seulement le formulaire d'immigration (33 messages)." : "Una solicitud puede marcar varias casillas. EN: solo el formulario de inmigración (33 mensajes)."}</p></div></section>`;
}
function sectionOrigen(t) {
  const cards = ["es", "fr", "en", "ru"].map(l => {
    const cs = D.country_split[l]; const items = D.country_by_lang[l].slice(0, 7).map(([k, n]) => [ctry(k), n, pct(n, cs.with_country)]);
    return `<div class="card"><h3 style="color:var(--c-${l})">${LNAME[l][lang]}</h3>${bars(items, l)}<p class="note">${pct(cs.spain, cs.with_country)} ${t.inSpain} · ${pct(cs.other, cs.with_country)} ${t.outSpain} · ${fmt(cs.none)} ${t.unknown}</p></div>`;
  }).join("");
  const nat = ["fr", "es", "en"].map(l => {
    const items = D.nat_by_lang[l].slice(0, 8).map(([k, n]) => [ctry(k), n]);
    return `<div class="card"><h3 style="color:var(--c-${l})">${LNAME[l][lang]}</h3>${items.length ? bars(items, l) : ""}<p class="note">${fmt(D.nat_n[l])} / ${fmt(TEXT_N(l))} ${lang === "fr" ? "messages déclarent une nationalité" : "mensajes declaran nacionalidad"}</p></div>`;
  }).join("");
  const fam = D.fam_nat.slice(0, 8).map(([k, n]) => `<span class="chip">${esc(ctry(k))}<i>${n}</i></span>`).join("");
  return `<section id="origen"><h2>${t.h_origen}</h2><p class="intro">${t.i_origen()}</p><h3>${t.ctryT}</h3><div class="grid">${cards}</div><p class="note">${t.cNote}</p><h3>${t.natT}</h3><div class="grid">${nat}</div><div class="card"><h3>${t.famNat}</h3><div class="chips">${fam}</div></div><p class="note">${t.traffic()}</p></section>`;
}

  const cell = (obj, a) => { const tot = sum(Object.values(obj)); const v = obj[a] || 0; return `<td class="n">${fmt(v)} <span class="note">(${pc(v, tot)} %)</span></td>`; };
  const rows = AR.map(a => `<tr><td>${a === "OTR" ? t.other : areaL(a)}</td>${cell(D.dropdown_area.es, a)}${cell(D.text_area.es, a)}${cell(D.dropdown_area.fr, a)}${cell(D.text_area.fr, a)}${cell(D.dropdown_area.en, a)}${cell(D.dropdown_area.ru, a)}</tr>`).join("");
  return `<section id="areas"><h2>${t.h_areas}</h2><p class="intro">${t.i_areas()}</p><div class="card scroll"><table><thead><tr><th></th><th class="n">ES ${t.colDD}</th><th class="n">ES ${t.colTX}</th><th class="n">FR ${t.colDD}</th><th class="n">FR ${t.colTX}</th><th class="n">EN ${t.colDD}</th><th class="n">RU ${t.colDD}</th></tr></thead><tbody>${rows}</tbody></table></div><p class="note">${lang === "fr" ? "Sans texte analysé pour EN et RU : seule la liste déroulante est disponible. « Texte » classe chaque demande selon le sous-thème dominant du message." : "Sin texto analizado para EN y RU: solo se dispone del desplegable. «Texto» clasifica cada solicitud por el subtema dominante del mensaje."}</p></section>`;
}
function sectionIdiomas(t) {
  const per = D.period_share;
  const cards = ["es", "fr", "en", "ru"].map(l => {
    const c = t.cards[l]; let body = `<h3 style="color:var(--c-${l})">${c.h}</h3><p>${c.p()}</p>`;
    const tags = Object.entries(D.tag_langs).map(([k, v]) => [k, v[l] || 0]).filter(x => x[1] > 0 && !x[0].startsWith("x_") && !["ext_general", "fis_general", "inm_general"].includes(x[0])).sort((a, b) => b[1] - a[1]).slice(0, 8);
    if (tags.length && l !== "ru") {
      const nTxt = TEXT_N(l);
      body += `<div><div class="eyebrow">${t.top} (n = ${fmt(nTxt)})</div>${bars(tags.map(([k, n]) => [tagL(k), n, pct(n, nTxt)]), l)}</div>`;
    }
    if (D.lift[l]) body += `<div><div class="eyebrow">${t.lift}</div><div class="chips">${D.lift[l].slice(0, 6).map(r => `<span class="chip">${esc(tagL(r[0]))}<i>×${r[4] >= 10 ? Math.round(r[4]) : r[4].toFixed(1).replace(".", lang === "fr" ? "," : ",")}</i></span>`).join("")}</div></div>`;
    return `<div class="card">${body}</div>`;
  }).join("");
  const tops = Object.keys(per[D.periods[2]].tags).map(k => [k, Math.max(...D.periods.map(p => per[p].tags[k] || 0))]).sort((a, b) => b[1] - a[1]).slice(0, 12).map(x => x[0]);
  const mx = Math.max(...tops.flatMap(k => D.periods.map(p => per[p].tags[k] || 0)));
  const trows = tops.map(k => `<tr><td>${esc(tagL(k))}</td>${D.periods.map(p => `<td class="n">${(per[p].tags[k] || 0).toFixed(1).replace(".", ",")} %</td>`).join("")}<td><span class="spark">${D.periods.map(p => `<i style="height:${Math.max(2, 22 * (per[p].tags[k] || 0) / mx)}px"></i>`).join("")}</span></td></tr>`).join("");
  return `<section id="idiomas"><h2>${t.h_idiomas}</h2><p class="intro">${t.i_idiomas}</p><div class="grid two">${cards}</div>
   <div class="card"><h3>${t.pTitle}</h3><div class="scroll"><table><thead><tr><th></th>${D.periods.map(p => `<th class="n">${p.replace("..", " → ")}<br><span style="text-transform:none;letter-spacing:0">n = ${per[p].n}</span></th>`).join("")}<th></th></tr></thead><tbody>${trows}</tbody></table></div><p class="note">${t.pNote}</p></div></section>`;
}
function sectionArbol(t) {
  const order = { SUC: ["SUC-0", "SUC-1", "SUC-2"], INM: ["INM-1"], LAB: ["LAB-1", "LAB-2", "LAB-3", "LAB-4"], MER: ["MER-1", "MER-2", "MER-3", "MER-4"], FIS: ["FIS-1", "FIS-2", "FIS-3"], EXT: ["EXT-1", "EXT-2", "EXT-3", "EXT-4"] };
  const areaOrder = ["EXT", "FIS", "INM", "SUC", "MER", "LAB"];
  let body = "";
  areaOrder.forEach(a => {
    const an = sum(order[a].map(k => (D.leaf_stats[k] || { n: 0 }).n));
    body += `<tr class="area"><td colspan="5">${areaL(a)} <span class="note" style="font-weight:400"> · ${t.areaNotes[a]()}</span></td></tr>`;
    order[a].forEach(k => {
      const lf = D.leaves[k]; const st = D.leaf_stats[k] || { n: 0, primary: 0, langs: {}, subtopics: [] };
      const prop = !lf.url;
      const subs = st.subtopics.slice(0, 7).map(([c, n]) => `<span class="chip">${esc(tagL(c))}<i>${n}</i></span>`).join("");
      body += `<tr class="${prop ? "prop" : ""}"><td>${esc(lf[lang])}<br><span class="tag ${prop ? "warn" : "good"}">${prop ? t.proposed : t.exists}</span></td><td class="n">${fmt(st.n)}</td><td class="n">${fmt(st.primary)}</td><td>${stackBar([[st.langs.es || 0, "--c-es"], [st.langs.en || 0, "--c-en"], [st.langs.fr || 0, "--c-fr"]])}<span class="note num">${st.langs.es || 0} · ${st.langs.en || 0} · ${st.langs.fr || 0}</span></td><td><div class="chips">${subs || '<span class="note">—</span>'}</div></td></tr>`;
    });
  });
  return `<section id="arbol"><h2>${t.h_arbol}</h2><p class="intro">${t.i_arbol}</p><div class="card scroll"><table><thead><tr><th>${t.colLeaf}</th><th class="n">${t.colN}</th><th class="n">${t.colPrim}</th><th>${t.colLang}</th><th>${t.colSub}</th></tr></thead><tbody>${body}</tbody></table></div></section>`;
}
function sectionCombos(t) {
  const rows = D.combos.slice(0, 15).map(([a, b, n]) => `<tr><td>${esc(tagL(a))} + ${esc(tagL(b))}</td><td class="n">${n}</td><td>${esc(t.pk[a + "|" + b] || "")}</td></tr>`).join("");
  const IL = k => t.ints[k][0];
  const prow = D.intents.pairs.slice(0, 8).map(([a, b, n]) => `<tr><td>${esc(IL(a))} + ${esc(IL(b))}</td><td class="n">${n}</td></tr>`).join("");
  return `<section id="combos"><h2>${t.h_combos}</h2><p class="intro">${t.i_combos}</p><div class="grid two"><div class="card scroll"><table><thead><tr><th>${t.colPair}</th><th class="n">${t.colPairN}</th><th>${t.pkg}</th></tr></thead><tbody>${rows}</tbody></table></div><div class="card scroll"><h3>${t.intentPairs}</h3><table><thead><tr><th>${t.colPair}</th><th class="n">${t.colPairN}</th></tr></thead><tbody>${prow}</tbody></table></div></div></section>`;
}
function sectionForm(t) {
  const steps = t.steps.map(s => `<div class="step"><span class="k">${s[0]}</span><h3>${s[1]}</h3><ul>${s[2].map(x => `<li>${x}</li>`).join("")}</ul></div>`).join("");
  const keys = Object.keys(D.intents.stats).sort((a, b) => D.intents.stats[b].n - D.intents.stats[a].n);
  const det = keys.map(k => {
    const st = D.intents.stats[k]; const [name, qs] = t.ints[k];
    const art = (D.suggest[k][lang] || []).map(a => `<a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a>`).join("") || `<span class="note">${t.noArt}</span>`;
    return `<details><summary>${esc(name)} <span class="tag">${fmt(st.n)} ${t.colShare.toLowerCase()}</span> <span class="tag good">${pct(st.bc, st.bc_of)} ${t.info}</span></summary><div class="body"><div><div class="eyebrow">${t.ask}</div><ol>${qs.map(q => `<li>${esc(q)}</li>`).join("")}</ol></div><div class="sg"><div class="eyebrow">${t.art}</div>${art}</div></div></details>`;
  }).join("");
  return `<section id="form"><h2>${t.h_form}</h2><p class="intro">${t.i_form}</p><div class="flow">${steps}</div><h3>${t.routesT}</h3>${det}</section>`;
}
function sectionBlog(t) {
  const cand = Object.keys(D.tag_langs).filter(k => !k.startsWith("x_") && !["ext_general", "fis_general", "inm_general"].includes(k)).map(k => {
    const lg = D.tag_langs[k], ps = D.posts_by_tag[k]; const tot = (lg.es || 0) + (lg.fr || 0) + (lg.en || 0);
    const gaps = ["es", "fr"].filter(l => (lg[l] || 0) >= 8 && ps[l] <= 1);
    return { k, lg, ps, tot, gaps };
  }).filter(r => r.tot >= 15).sort((a, b) => (b.gaps.length > 0) - (a.gaps.length > 0) || b.tot - a.tot).slice(0, 24);
  const rows = cand.map(r => `<tr><td>${esc(tagL(r.k))}</td><td class="n">${r.lg.es || 0} · ${r.lg.fr || 0} · ${r.lg.en || 0}</td><td class="n">${r.ps.es} · ${r.ps.en} · ${r.ps.fr}</td><td>${r.gaps.length ? `<span class="tag warn">${t.gap} ${r.gaps.map(x => x.toUpperCase()).join(", ")}</span>` : `<span class="tag good">${t.ok}</span>`}</td></tr>`).join("");
  const read = D.blog_read_top.filter(x => x[0] !== "/fr/blog").slice(0, 8).map(([p, n]) => [p.replace(/^\/(fr|en|ru)?\/?blog\//, ""), n]);
  return `<section id="blog"><h2>${t.h_blog}</h2><p class="intro">${t.i_blog()}</p><div class="grid two"><div class="card scroll"><table><thead><tr><th>${t.colSubB}</th><th class="n">${t.colLeads}</th><th class="n">${t.colPosts}</th><th></th></tr></thead><tbody>${rows}</tbody></table><p class="note">${t.gapN} ${t.enNote}</p></div><div class="card"><h3>${t.readT}</h3>${bars(read, "fr")}</div></div></section>`;
}
function sectionRecs(t) {
  return `<section id="recom"><h2>${t.h_recom}</h2><ol class="recs">${t.recs.map(r => `<li><strong>${r[0]}</strong><span>${r[1]}</span></li>`).join("")}</ol></section>`;
}
function sectionMetodo(t) {
  return `<section id="metodo"><h2>${t.h_metodo}</h2><div class="card"><ul style="margin:0;padding-left:18px;display:grid;gap:6px">${t.metodo().map(x => `<li>${x}</li>`).join("")}</ul></div><div class="card files"><h3>${t.files}</h3><ul style="margin:0;padding-left:18px;display:grid;gap:4px">${t.filesList.map(f => `<li><code>${f[0]}</code> ${f[1]}</li>`).join("")}</ul></div><p class="note">${t.foot}</p></section>`;
}
function render() {
  const t = X[lang]; document.documentElement.lang = lang;
  document.getElementById("toc").innerHTML = t.toc.map(x => `<a href="#${x[0]}">${x[1]}</a>`).join("");
  const kp = [fmt(D.meta.total), fmt(D.meta.coverage.text_analysed), K.multiPct + (lang === "fr" ? " %" : " %"), Math.round(100 * sum(["es", "fr"].map(l => D.blog_candidate[l].n)) / sum(["es", "fr"].map(l => D.blog_candidate[l].of))) + (lang === "fr" ? " %" : " %"), K.blog + (lang === "fr" ? " %" : " %")];
  const fs = t.find().map(f => `<li><strong>${f[0]}</strong><span>${f[1]}</span></li>`).join("");
  document.getElementById("app").innerHTML = (`<div class="hero"><span class="eyebrow">${t.eyebrow}</span><h1>${t.title}</h1><p class="lead">${t.lead()}</p><div class="kpis">${t.kpi.map((k, i) => `<div class="kpi"><b>${kp[i]}</b><span>${k[0]}</span></div>`).join("")}</div></div>
   <section id="esencial"><h2>${t.h_esencial}</h2><ul class="find">${fs}</ul></section>${sectionVolume(t)}${sectionTipo(t)}${sectionOrigen(t)}${sectionAreas(t)}${sectionIdiomas(t)}${sectionArbol(t)}${sectionCombos(t)}${sectionForm(t)}${sectionBlog(t)}${sectionRecs(t)}${sectionMetodo(t)}`).replace(/\{MULTI\}/g, K.multiPct).replace(/\{NAT\}/g, K.natPct);
  document.getElementById("b-es").setAttribute("aria-pressed", lang === "es"); document.getElementById("b-fr").setAttribute("aria-pressed", lang === "fr");
  document.title = lang === "fr" ? "Cartographie des demandes" : "Mapa de solicitudes";
}
function setLang(l) { lang = l; try { localStorage.setItem("dl-leads-lang", l); } catch (e) { } render(); }
document.getElementById("b-es").onclick = () => setLang("es");
document.getElementById("b-fr").onclick = () => setLang("fr");
(function init() {
  let l = "es";
  try { const s = localStorage.getItem("dl-leads-lang"); if (s === "fr" || s === "es") l = s; } catch (e) { }
  if (location.hash === "#fr" || location.hash === "#es") l = location.hash.slice(1);
  lang = l; render();
})();
</script>
